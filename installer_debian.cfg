#***q4os*setup*config*header*do*not*delete*it***#

TEMPLATES_DIR_0="$TEMPLATESDIR0"
TEMPLATES_DIR="setup_templates.4"

OUT_DIR="../_00_setup_out"
CHKINSTALL_COMMAND="echo"
INSTALL_PREFIX="/"
# PREPACK_SH="1"
APPLNK_ENTRY="0"
MENU_ENTRY="0"
DESKTOP_ENTRY="0"
REG_ENTRY="0"
UNINSTALL_ENTRY="0"
PK_NAME="q4os-desktop-plasma"
PK_VERS="4.9"
PK_RELEASE="a1"
#plasma-desktop-data..needed as pre-dependency for configuring panel layout in postinst script, it's possible remove it for plasma 5.20 and higher
PK_DEPENDS="libc6, plasma-workspace, plasma-desktop-data"
PK_PRE_DEPENDS="$PK_DEPENDS, q4os-base"
#desktop-base..debian specific customizations
PK_RECOMMENDS="desktop-base, sddm, sddm-theme-breeze, kde-plasma-desktop, plasma-nm, plasma-pa, kdialog, dolphin, fonts-noto-core, fonts-noto-ui-core, q4os-cpuq5, q4os-welcome5"
PK_CONFLICTS=""
PK_MAINTAINER="q4os@q4os.org"
QS_ARCHES="all"
CREATE_ESH="0"

